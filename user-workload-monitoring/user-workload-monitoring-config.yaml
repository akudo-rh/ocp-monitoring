apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    alertmanager:
      enabled: true
      enableAlertmanagerConfig: true
      volumeClaimTemplate:
        spec:
          storageClassName: <storage-class-name>   # ストレージクラス名
          resources:
            requests:
              storage: 5Gi
    prometheus:
      retention: 15d
      retentionSize: 40GB                          # PVC容量(50Gi)の約8割。満杯防止
      volumeClaimTemplate:
        spec:
          storageClassName: <storage-class-name>   # ストレージクラス名
          resources:
            requests:
              storage: 50Gi
    thanosRuler:
      retention: 15d
      volumeClaimTemplate:
        spec:
          storageClassName: <storage-class-name>   # ストレージクラス名
          resources:
            requests:
              storage: 10Gi
