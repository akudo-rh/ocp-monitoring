apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: <namespace-name>
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        image: quay.io/brancz/prometheus-example-app:v0.2.0 # メトリクスを返すサンプルアプリ
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-service
  labels:
    app: sample-app
spec:
  selector:
    app: sample-app
  ports:
  - name: web
    port: 8080
    targetPort: 8080

