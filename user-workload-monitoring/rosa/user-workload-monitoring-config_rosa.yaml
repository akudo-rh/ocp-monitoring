apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    alertmanager:
      enabled: true
      enableAlertmanagerConfig: true
    # 永続化設定を追加
    prometheus:
      retention: 10d                               # 保存期間
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-csi               # ストレージクラス名
          resources:
            requests:
              storage: 5Gi                        # リクエストサイズ
    thanosRuler:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-csi               # ストレージクラス名
          resources:
            requests:
              storage: 5Gi                        # リクエストサイズ