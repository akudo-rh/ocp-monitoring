# User Workload Monitoring (UWM) を有効化するためのConfigMap
# 適用: oc apply -f cluster-monitoring-config.yaml
# 必要権限: cluster-admin
# 適用後、openshift-user-workload-monitoring プロジェクトに
# prometheus-user-workload / thanos-ruler-user-workload 等のPodが起動する
#
# alertmanagerMain.enableUserAlertmanagerConfig: true について
#   enableUserWorkload だけではアプリチームが作成した AlertmanagerConfig は
#   無視される(ルーティングに反映されない)。
#   アプリチームのアラート通知(手順⑦)を機能させるには、この設定も必須。
#
# 永続化サイズの考え方:
#   Prometheus は retention(15d) と retentionSize(40GB) のうち先に到達した方で古いデータを削除する。
#   レプリカ2台それぞれに PVC が作成される(Prometheus: 50Gi x 2, Alertmanager: 5Gi x 2)。
#   PVC は拡張のみ可能(縮小不可)。実測で見直すこと(README「モニタリングデータ量の算出方法」参照)。
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
      volumeClaimTemplate:
        spec:
          storageClassName: <storage-class-name>  # ストレージクラス名
          resources:
            requests:
              storage: 5Gi
    prometheusK8s:
      retention: 15d
      retentionSize: 40GB                         # PVC容量(50Gi)の約8割。満杯防止
      volumeClaimTemplate:
        spec:
          storageClassName: <storage-class-name>  # ストレージクラス名
          resources:
            requests:
              storage: 50Gi
