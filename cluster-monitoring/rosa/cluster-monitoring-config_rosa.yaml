# User Workload Monitoring (UWM) を有効化するためのConfigMap
# 適用: oc apply -f cluster-monitoring-config_rosa.yaml
# 必要権限: cluster-admin
# 適用後、openshift-user-workload-monitoring プロジェクトに
# prometheus-user-workload / thanos-ruler-user-workload 等のPodが起動する
#
# 永続化サイズの考え方:
#   Prometheus は retention(15d) と retentionSize(40GB) のうち先に到達した方で古いデータを削除する。
#   レプリカ2台それぞれに PVC が作成される(Prometheus: 50Gi x 2, Alertmanager: 5Gi x 2)。
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-csi
          resources:
            requests:
              storage: 5Gi
    prometheusK8s:
      retention: 15d
      retentionSize: 40GB                         # PVC容量(50Gi)の約8割。満杯防止
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-csi
          resources:
            requests:
              storage: 50Gi
